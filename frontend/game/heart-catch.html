<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>心动捕捉 · 恋爱小游戏</title>
<style>
  :root {
    --ink: #4a2b3a;
    --muted: #8a6474;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #ffd6e0 0%, #ffeef2 40%, #f6ecff 100%);
    color: var(--ink);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

  /* ---------- 个人中心浮层 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(74, 43, 58, 0.34);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }
  .overlay.hidden { display: none; }
  .panel {
    width: 100%;
    max-width: 470px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: linear-gradient(160deg, #fff8fa 0%, #fff0f5 100%);
    border: 1px solid rgba(255, 255, 255, 0.85);
    border-radius: 22px;
    box-shadow: 0 24px 64px rgba(180, 80, 110, 0.3);
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(230, 69, 111, 0.12);
  }
  .panel-title { font-size: 17px; font-weight: 700; color: var(--ink); }
  .close {
    border: none;
    background: rgba(230, 69, 111, 0.1);
    color: var(--muted);
    width: 30px; height: 30px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
  }
  .close:hover { background: rgba(230, 69, 111, 0.2); color: var(--ink); }
  .panel-body { padding: 16px 20px 20px; overflow-y: auto; }

  .profile { display: flex; flex-direction: column; gap: 14px; }
  .profile-label { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .avatar-picker { display: flex; flex-wrap: wrap; gap: 8px; }
  .avatar-btn {
    border: 2px solid transparent;
    background: #fff;
    border-radius: 12px;
    width: 44px; height: 44px;
    font-size: 22px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .avatar-btn:hover { transform: scale(1.08); }
  .avatar-btn.active { border-color: #e62d55; background: #ffe4ec; }
  .name-row { display: flex; gap: 10px; }
  .name-input {
    flex: 1;
    border: 1.5px solid rgba(230, 69, 111, 0.25);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 15px;
    color: var(--ink);
    outline: none;
    background: #fff;
    user-select: text;
    -webkit-user-select: text;
  }
  .name-input:focus { border-color: #e62d55; }
  .btn-primary {
    border: none;
    background: linear-gradient(135deg, #ff5c8a, #e62d55);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    padding: 11px 20px;
    border-radius: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-primary:hover { opacity: 0.92; }

  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 18px;
  }
  .stat {
    background: #fff;
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    border: 1px solid rgba(230, 69, 111, 0.1);
  }
  .stat .num { font-size: 20px; font-weight: 800; color: #e62d55; }
  .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .records { margin-top: 18px; }
  .records-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .records-head .ttl { font-size: 14px; font-weight: 700; color: var(--ink); }
  .records-head .clear { border: none; background: none; color: var(--muted); font-size: 12px; cursor: pointer; }
  .records-head .clear:hover { color: #e62d55; }
  .rec-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 260px;
    overflow-y: auto;
  }
  .rec {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border-radius: 12px;
    padding: 10px 14px;
    border: 1px solid rgba(230, 69, 111, 0.1);
  }
  .rec-icon { font-size: 22px; }
  .rec-main { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .rec-title { font-size: 14px; font-weight: 700; color: var(--ink); }
  .rec-meta { font-size: 11px; color: var(--muted); }
  .rec-score { font-size: 16px; font-weight: 800; color: #e62d55; white-space: nowrap; }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>

<div id="overlay" class="overlay hidden">
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">💗 我的心动档案</div>
      <button class="close" id="closePanel" type="button">✕</button>
    </div>
    <div class="panel-body">
      <div class="profile">
        <div>
          <div class="profile-label">选择头像</div>
          <div class="avatar-picker" id="avatarPicker">
            <button class="avatar-btn" data-avatar="💘" type="button">💘</button>
            <button class="avatar-btn" data-avatar="💖" type="button">💖</button>
            <button class="avatar-btn" data-avatar="💗" type="button">💗</button>
            <button class="avatar-btn" data-avatar="💕" type="button">💕</button>
            <button class="avatar-btn" data-avatar="😊" type="button">😊</button>
            <button class="avatar-btn" data-avatar="🐻" type="button">🐻</button>
            <button class="avatar-btn" data-avatar="🐰" type="button">🐰</button>
            <button class="avatar-btn" data-avatar="🐱" type="button">🐱</button>
            <button class="avatar-btn" data-avatar="🦊" type="button">🦊</button>
            <button class="avatar-btn" data-avatar="🍓" type="button">🍓</button>
            <button class="avatar-btn" data-avatar="🌸" type="button">🌸</button>
            <button class="avatar-btn" data-avatar="🌙" type="button">🌙</button>
          </div>
        </div>
        <div class="name-row">
          <input class="name-input" id="nameInput" maxlength="12" placeholder="输入你的昵称" />
          <button class="btn-primary" id="saveProfile" type="button">保存</button>
        </div>
      </div>

      <div class="stats" id="stats">
        <div class="stat"><div class="num" id="stGames">0</div><div class="lbl">总场次</div></div>
        <div class="stat"><div class="num" id="stBest">0</div><div class="lbl">历史最高分</div></div>
        <div class="stat"><div class="num" id="stCombo">0</div><div class="lbl">最高连击</div></div>
        <div class="stat"><div class="num" id="stAvg">0</div><div class="lbl">平均分</div></div>
      </div>

      <div class="records">
        <div class="records-head">
          <span class="ttl">游玩记录</span>
          <button class="clear" id="clearRecords" type="button">清空记录</button>
        </div>
        <ul class="rec-list" id="recordList"></ul>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ================= 基础 =================
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    player.x = clamp(player.x, player.w / 2 + 8, W - player.w / 2 - 8);
  }
  window.addEventListener('resize', resize);

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function randi(a, b) { return Math.floor(rand(a, b + 1)); }

  // ================= 音效（Web Audio 合成） =================
  var audio = null;
  var muted = false;
  function initAudio() {
    if (audio) return;
    try {
      audio = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { audio = null; }
  }
  function tone(freq, dur, type, vol, when) {
    if (!audio || muted) return;
    type = type || 'sine';
    var t0 = (when || 0) + audio.currentTime;
    var osc = audio.createOscillator();
    var g = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol || 0.15, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(audio.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  var sfx = {
    catch: function (step) { tone(620 + step * 60, 0.14, 'sine', 0.16); },
    star: function () { tone(880, 0.12, 'triangle', 0.16); tone(1320, 0.18, 'triangle', 0.14, 0.06); },
    hit: function () { tone(160, 0.22, 'sawtooth', 0.18); tone(95, 0.28, 'square', 0.12, 0.03); },
    combo: function (n) { tone(520 + n * 40, 0.1, 'triangle', 0.14); },
    fever: function () {
      [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.22, 'triangle', 0.16, i * 0.09); });
    },
    over: function () { tone(392, 0.3, 'sine', 0.14); tone(330, 0.34, 'sine', 0.14, 0.12); tone(262, 0.5, 'sine', 0.15, 0.24); },
    click: function () { tone(440, 0.08, 'triangle', 0.12); }
  };

  // ================= 游戏状态 =================
  var state = 'menu';   // menu | playing | over
  var MAX_LIVES = 5;
  var score = 0, lives = MAX_LIVES, level = 1, combo = 0, bestCombo = 0;
  var loveMeter = 0;    // 0..100
  var fever = 0;        // 剩余秒数
  var spawnTimer = 0;
  var time = 0;
  var shake = 0;
  var flash = 0;
  var lastScorePop = 0;
  var caughtCount = 0;
  var items = [];
  var particles = [];
  var floaters = [];
  var popups = [];

  var player = { x: 0, w: 96, h: 68, vx: 0, tilt: 0 };
  var input = { mode: 'mouse', targetX: 0, keyDir: 0 };

  var best = 0;
  try { best = parseInt(localStorage.getItem('heartcatch.best') || '0', 10) || 0; } catch (e) {}

  // ================= 用户信息与游玩记录 =================
  function loadUser() {
    try { return JSON.parse(localStorage.getItem('heartcatch.user') || 'null'); } catch (e) { return null; }
  }
  function saveUser() {
    try { localStorage.setItem('heartcatch.user', JSON.stringify(user)); } catch (e) {}
  }
  function loadRecords() {
    try { var r = JSON.parse(localStorage.getItem('heartcatch.records') || '[]'); return Array.isArray(r) ? r : []; } catch (e) { return []; }
  }
  function saveRecords() {
    try { localStorage.setItem('heartcatch.records', JSON.stringify(records)); } catch (e) {}
  }

  var user = loadUser();
  if (!user) { user = { name: '心动玩家', avatar: '💘', createdAt: Date.now() }; saveUser(); }
  var records = loadRecords();
  var currentAvatar = user.avatar;

  // ================= 个人中心面板 =================
  var overlay = document.getElementById('overlay');
  var nameInput = document.getElementById('nameInput');
  var avatarPicker = document.getElementById('avatarPicker');
  var avatarButtons = avatarPicker.querySelectorAll('.avatar-btn');

  function fmtTime(ts) {
    var d = new Date(ts);
    function p(n) { return n < 10 ? '0' + n : '' + n; }
    return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function highlightAvatar(a) {
    currentAvatar = a;
    for (var i = 0; i < avatarButtons.length; i++) {
      var b = avatarButtons[i];
      if (b.getAttribute('data-avatar') === a) b.classList.add('active');
      else b.classList.remove('active');
    }
  }

  function renderStats() {
    var n = records.length;
    var bestScore = 0, bestC = 0, sum = 0;
    for (var i = 0; i < n; i++) {
      if (records[i].score > bestScore) bestScore = records[i].score;
      if (records[i].combo > bestC) bestC = records[i].combo;
      sum += records[i].score;
    }
    document.getElementById('stGames').textContent = n;
    document.getElementById('stBest').textContent = bestScore;
    document.getElementById('stCombo').textContent = bestC;
    document.getElementById('stAvg').textContent = n ? Math.round(sum / n) : 0;
  }

  function renderRecords() {
    var list = document.getElementById('recordList');
    list.innerHTML = '';
    if (!records.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '还没有游玩记录，快去玩一局吧～';
      list.appendChild(li);
      return;
    }
    var arr = records.slice().reverse().slice(0, 30);
    for (var i = 0; i < arr.length; i++) {
      var r = arr[i];
      var li = document.createElement('li');
      li.className = 'rec';
      var icon = document.createElement('span'); icon.className = 'rec-icon'; icon.textContent = r.icon || '💘';
      var main = document.createElement('span'); main.className = 'rec-main';
      var t1 = document.createElement('span'); t1.className = 'rec-title'; t1.textContent = r.title || '心动';
      var t2 = document.createElement('span'); t2.className = 'rec-meta';
      t2.textContent = fmtTime(r.time) + ' · 第' + r.level + '关 · 连击' + r.combo;
      main.appendChild(t1); main.appendChild(t2);
      var sc = document.createElement('span'); sc.className = 'rec-score'; sc.textContent = r.score + '分';
      li.appendChild(icon); li.appendChild(main); li.appendChild(sc);
      list.appendChild(li);
    }
  }

  function saveProfile() {
    var name = nameInput.value.trim();
    if (name) user.name = name;
    user.avatar = currentAvatar;
    saveUser();
  }

  function openPanel() {
    initAudio();
    nameInput.value = user.name;
    highlightAvatar(user.avatar);
    renderStats();
    renderRecords();
    overlay.classList.remove('hidden');
  }
  function closePanel() {
    saveProfile();
    overlay.classList.add('hidden');
  }

  document.getElementById('closePanel').addEventListener('click', closePanel);
  document.getElementById('saveProfile').addEventListener('click', function () { saveProfile(); sfx.click(); });
  document.getElementById('clearRecords').addEventListener('click', function () {
    if (confirm('确定清空所有游玩记录吗？')) {
      records = [];
      saveRecords();
      renderStats();
      renderRecords();
      sfx.click();
    }
  });
  avatarPicker.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('.avatar-btn') : null;
    if (b) { highlightAvatar(b.getAttribute('data-avatar')); sfx.click(); }
  });
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closePanel();
  });

  // ================= 道具类型 =================
  var TYPES = {
    heart:  { emoji: '❤️', w: 40, good: true,  score: 1,  love: 3,  color: '#ff4d6d' },
    pink:   { emoji: '💖', w: 46, good: true,  score: 3,  love: 5,  color: '#ff7ba0' },
    star:   { emoji: '🌟', w: 46, good: true,  score: 10, love: 12, color: '#ffc94d' },
    broken: { emoji: '💔', w: 42, good: false, score: 0,  love: 0,  color: '#7a5560' },
    bolt:   { emoji: '⚡', w: 40, good: false, score: 0,  love: 0,  color: '#ffb020' }
  };

  function pickType() {
    var r = Math.random();
    var d = fever > 0 ? 0 : Math.min(0.26, 0.14 + level * 0.02); // 障碍概率
    if (r < d) return Math.random() < 0.55 ? TYPES.broken : TYPES.bolt;
    r = Math.random();
    if (r < 0.06) return TYPES.star;
    if (r < 0.30) return TYPES.pink;
    return TYPES.heart;
  }

  // ================= 背景漂浮爱心 =================
  function makeFloater(reset) {
    return {
      x: Math.random() * W,
      y: reset ? H + 60 : Math.random() * H,
      size: rand(10, 34),
      speed: rand(18, 55),
      drift: rand(-0.5, 0.5),
      phase: Math.random() * Math.PI * 2,
      alpha: rand(0.06, 0.2),
      hue: Math.random() < 0.5 ? 340 : 318
    };
  }
  function initFloaters() {
    floaters = [];
    for (var i = 0; i < 26; i++) floaters.push(makeFloater(false));
  }

  // ================= 生成与更新 =================
  function spawnItem() {
    var t = pickType();
    var x = rand(t.w / 2 + 14, W - t.w / 2 - 14);
    var base = 120 + level * 22;
    items.push({
      type: t, x: x, y: -t.w,
      vy: rand(base * 0.85, base * 1.3),
      swayAmp: rand(8, 30), swayFreq: rand(0.6, 1.4), swayPhase: Math.random() * Math.PI * 2,
      rot: rand(-0.4, 0.4), rotV: rand(-1.2, 1.2)
    });
  }

  function spawnInterval() {
    var base = Math.max(0.34, 0.95 - level * 0.075);
    return base * rand(0.8, 1.25);
  }

  function burst(x, y, color, n, power) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = rand(0.4, 1) * (power || 1);
      particles.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.5,
        life: 1, decay: rand(0.02, 0.05), size: rand(2, 5), color: color, shape: Math.random() < 0.6 ? 'heart' : 'dot'
      });
    }
  }

  function addPopup(x, y, text, color, size) {
    popups.push({ x: x, y: y, text: text, color: color || '#ff4d6d', size: size || 20, life: 1 });
  }

  function loseLife(x, y) {
    lives--;
    shake = 0.5;
    sfx.hit();
    burst(x, y, '#ffb020', 20, 1.3);
    if (lives <= 0) endGame();
  }

  function gainHeart(t, item) {
    var mult = fever > 0 ? 2 : 1;
    var pts = t.score * mult;
    combo++;
    caughtCount++;
    if (combo > bestCombo) bestCombo = combo;
    score += pts;
    if (fever <= 0) loveMeter = Math.min(100, loveMeter + t.love * mult); // 心动爆发期间不累计心动值，避免无限连爆

    var color = t.color;
    burst(item.x, item.y, color, t === TYPES.star ? 26 : 14, t === TYPES.star ? 1.6 : 1);
    addPopup(item.x, item.y - 10, '+' + pts, color, t === TYPES.star ? 24 : 20);
    if (t === TYPES.star) { sfx.star(); }
    else { sfx.catch(combo % 6); }

    if (combo > 0 && combo % 5 === 0) {
      sfx.combo(Math.min(combo / 5, 6));
      addPopup(player.x, player.y - 60, '连击 x' + combo, '#ff5c8a', 26);
    }
    if (loveMeter >= 100) triggerFever();
  }

  function triggerFever() {
    loveMeter = 0;
    fever = 5;
    flash = 1.2;
    shake = 0.4;
    sfx.fever();
    var cx = W / 2, cy = H / 2;
    for (var i = 0; i < 40; i++) {
      var a = (i / 40) * Math.PI * 2;
      particles.push({ x: cx, y: cy, vx: Math.cos(a) * 5, vy: Math.sin(a) * 5, life: 1.4, decay: 0.012, size: rand(3, 7), color: i % 2 ? '#ff4d6d' : '#ff9ec6', shape: 'heart' });
    }
    addPopup(cx, cy - 40, '告白成功！心动爆发', '#ff2d55', 30);
  }

  function update(dt) {
    time += dt;
    if (fever > 0) fever = Math.max(0, fever - dt); // 心动爆发计时衰减

    // 玩家移动
    if (input.mode === 'key') {
      player.x += input.keyDir * 560 * dt;
    } else {
      player.x = lerp(player.x, input.targetX, 1 - Math.pow(0.0015, dt));
    }
    player.x = clamp(player.x, player.w / 2 + 8, W - player.w / 2 - 8);
    var oldX = player.x;
    player.tilt = lerp(player.tilt, (player.x - oldX) * 0.06, 0.2);
    player.tilt = clamp(player.tilt, -0.22, 0.22);

    // 生成
    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawnItem(); spawnTimer = spawnInterval(); }

    // 道具更新
    for (var i = items.length - 1; i >= 0; i--) {
      var it = items[i];
      it.y += it.vy * dt;
      it.swayPhase += it.swayFreq * dt * 2;
      it.rot += it.rotV * dt;
      it.x += Math.sin(it.swayPhase) * it.swayAmp * dt;

      var yTop = player.y - player.h;
      var halfW = it.type.w / 2 * 0.8;
      if (it.y > yTop - 6 && it.y < player.y + 8 &&
          it.x > player.x - player.w / 2 - halfW + 6 && it.x < player.x + player.w / 2 + halfW - 6) {
        if (it.type.good) gainHeart(it.type, it);
        else loseLife(it.x, it.y);
        items.splice(i, 1);
        continue;
      }
      if (it.y > H + 60) {
        if (it.type.good) {
          combo = 0;
          loseLife(it.x, H - 30);
          addPopup(it.x, H - 48, '错过心动', '#e6456f', 20);
        }
        items.splice(i, 1);
      }
    }

    // 关卡与心动值
    level = 1 + Math.floor(caughtCount / 18);
    if (level > 1 && Math.floor((caughtCount - 1) / 18) !== Math.floor(caughtCount / 18)) {
      addPopup(W / 2, H * 0.4, '第 ' + level + ' 关', '#c26a8a', 24);
    }

    // 粒子
    for (var j = particles.length - 1; j >= 0; j--) {
      var p = particles[j];
      p.x += p.vx * 60 * dt;
      p.y += p.vy * 60 * dt;
      p.vy += 0.08;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(j, 1);
    }

    // 弹出文字
    for (var k = popups.length - 1; k >= 0; k--) {
      var pp = popups[k];
      pp.y -= 34 * dt;
      pp.life -= dt * 0.9;
      if (pp.life <= 0) popups.splice(k, 1);
    }

    // 背景
    for (var m = 0; m < floaters.length; m++) {
      var f = floaters[m];
      f.y -= f.speed * dt;
      f.x += Math.sin(time * 0.6 + f.phase) * f.drift;
      if (f.y < -60) { floaters[m] = makeFloater(true); }
    }
  }

  // ================= 绘制 =================
  function drawHeartShape(ctx, x, y, size) {
    ctx.beginPath();
    ctx.moveTo(x, y + size * 0.32);
    ctx.bezierCurveTo(x, y, x - size * 0.5, y - size * 0.22, x - size * 0.5, y + size * 0.14);
    ctx.bezierCurveTo(x - size * 0.5, y + size * 0.42, x, y + size * 0.6, x, y + size * 0.78);
    ctx.bezierCurveTo(x, y + size * 0.6, x + size * 0.5, y + size * 0.42, x + size * 0.5, y + size * 0.14);
    ctx.bezierCurveTo(x + size * 0.5, y - size * 0.22, x, y, x, y + size * 0.32);
    ctx.closePath();
  }

  function drawEmoji(emoji, x, y, size, rot) {
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    ctx.font = size + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, 0, 0);
    ctx.restore();
  }

  function drawPlayer() {
    var x = player.x, y = player.y;
    var tilt = player.tilt;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);

    // 阴影
    ctx.beginPath();
    ctx.ellipse(0, 2, player.w * 0.5, 10, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(180,80,110,0.18)';
    ctx.fill();

    // 篮子主体（上窄下宽）
    var bw = player.w, bh = player.h;
    var topW = bw * 0.62, botW = bw;
    var grad = ctx.createLinearGradient(0, -bh / 2, 0, bh / 2);
    grad.addColorStop(0, '#ff9db5');
    grad.addColorStop(1, '#ff5c8a');
    ctx.beginPath();
    ctx.moveTo(-topW / 2, -bh * 0.42);
    ctx.quadraticCurveTo(0, -bh * 0.5, topW / 2, -bh * 0.42);
    ctx.lineTo(botW / 2, bh * 0.38);
    ctx.quadraticCurveTo(0, bh * 0.5, -botW / 2, bh * 0.38);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#e6456f';
    ctx.stroke();

    // 篮口
    ctx.beginPath();
    ctx.ellipse(0, -bh * 0.42, topW / 2, 9, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd1dc';
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#e6456f';
    ctx.stroke();

    // 脸蛋
    var ey = -bh * 0.05;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(-13, ey, 6.5, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(13, ey, 6.5, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a2230';
    ctx.beginPath(); ctx.arc(-14, ey + 1, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(12, ey + 1, 3, 0, Math.PI * 2); ctx.fill();
    // 腮红
    ctx.fillStyle = 'rgba(255,90,120,0.5)';
    ctx.beginPath(); ctx.ellipse(-22, ey + 9, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(22, ey + 9, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    // 微笑
    ctx.beginPath();
    ctx.arc(0, ey + 7, 7, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#3a2230'; ctx.stroke();

    // 小手
    ctx.fillStyle = '#ff8fa3';
    ctx.beginPath(); ctx.arc(-bw * 0.48, 4, 8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(bw * 0.48, 4, 8, 0, Math.PI * 2); ctx.fill();

    // 头顶小爱心
    drawHeartShape(ctx, 0, -bh * 0.5 - 12, 9);
    ctx.fillStyle = '#ff2d55';
    ctx.fill();

    ctx.restore();
  }

  function drawHUD() {
    // 顶部条
    ctx.save();
    var pad = 14, top = 12, h = 30;
    // 生命
    for (var i = 0; i < MAX_LIVES; i++) {
      var x = pad + i * 30 + 14;
      ctx.globalAlpha = i < lives ? 1 : 0.22;
      drawHeartShape(ctx, x, top + 15, 13);
      ctx.fillStyle = '#e6456f';
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 分数（居中）
    ctx.font = '700 26px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(74,43,58,0.85)';
    ctx.fillText(String(score), W / 2, top + 16);

    // 关卡 + 最高分
    ctx.font = '600 13px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(74,43,58,0.55)';
    ctx.fillText('第 ' + level + ' 关 · 最高 ' + Math.max(best, score), W - pad, top + 8);
    ctx.font = '600 13px -apple-system, "PingFang SC", sans-serif';
    ctx.fillText('连击 ' + combo, W - pad, top + 24);

    // 心动值进度条
    var bw = Math.min(W - pad * 2 - 90, 260), bx = W / 2 - bw / 2, by = top + h + 6, bh = 12;
    roundRect(bx - 1, by - 1, bw + 2, bh + 2, 8);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fill();
    roundRect(bx, by, bw, bh, 7);
    ctx.fillStyle = 'rgba(230,69,111,0.14)';
    ctx.fill();
    roundRect(bx, by, bw * (loveMeter / 100), bh, 7);
    var lg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    lg.addColorStop(0, '#ff8fa3'); lg.addColorStop(1, '#ff2d55');
    ctx.fillStyle = lg;
    ctx.fill();
    ctx.font = '700 11px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('心动值', bx + bw / 2, by + bh / 2 + 0.5);

    // 心动值文字标签
    ctx.font = '600 11px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(74,43,58,0.55)';
    ctx.fillText('❤ 心动值', bx - 66, by + bh / 2 + 0.5);
    ctx.restore();

    // Fever 提示
    if (fever > 0) {
      ctx.save();
      ctx.font = '700 20px -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      var pulse = 0.7 + 0.3 * Math.sin(time * 8);
      ctx.fillStyle = 'rgba(255,45,85,' + pulse + ')';
      ctx.fillText('💘 心动爆发 ×2', W / 2, H * 0.22);
      ctx.restore();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawItems() {
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var glow = it.type.good ? it.type.color : 'rgba(120,80,90,0.5)';
      ctx.save();
      ctx.globalAlpha = 0.22;
      drawHeartShape(ctx, it.x, it.y, it.type.w * 0.9);
      ctx.fillStyle = glow;
      ctx.fill();
      ctx.restore();
      drawEmoji(it.type.emoji, it.x, it.y, it.type.w, it.rot);
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      if (p.shape === 'heart') {
        drawHeartShape(ctx, p.x, p.y, p.size * 2.2);
        ctx.fillStyle = p.color;
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawFloaters() {
    for (var i = 0; i < floaters.length; i++) {
      var f = floaters[i];
      ctx.save();
      ctx.globalAlpha = f.alpha;
      drawHeartShape(ctx, f.x, f.y, f.size);
      ctx.fillStyle = 'hsla(' + f.hue + ', 70%, 70%, 1)';
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPopups() {
    for (var i = 0; i < popups.length; i++) {
      var pp = popups[i];
      ctx.save();
      ctx.globalAlpha = clamp(pp.life, 0, 1);
      ctx.font = '700 ' + pp.size + 'px -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.strokeText(pp.text, pp.x, pp.y);
      ctx.fillStyle = pp.color;
      ctx.fillText(pp.text, pp.x, pp.y);
      ctx.restore();
    }
  }

  function drawMenu() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    var cx = W / 2;

    // 顶部用户栏
    ctx.save();
    ctx.textAlign = 'left';
    var ux = 20, uy = 24;
    ctx.beginPath();
    ctx.arc(ux + 22, uy + 22, 21, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(230,69,111,0.25)';
    ctx.stroke();
    drawEmoji(user.avatar, ux + 22, uy + 22, 24);
    ctx.font = '700 16px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#4a2b3a';
    ctx.fillText(user.name, ux + 52, uy + 15);
    ctx.font = '600 12px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = 'rgba(74,43,58,0.55)';
    ctx.fillText('📖 我的心动档案 · 战绩与记录', ux + 52, uy + 34);
    ctx.restore();

    // 大标题心跳
    var beat = 1 + 0.06 * Math.sin(time * 3.2);
    ctx.save();
    ctx.translate(cx, H * 0.24);
    ctx.scale(beat, beat);
    drawHeartShape(ctx, 0, -40, 64);
    var tg = ctx.createLinearGradient(0, -80, 0, 20);
    tg.addColorStop(0, '#ff8fa3'); tg.addColorStop(1, '#e62d55');
    ctx.fillStyle = tg;
    ctx.fill();
    drawEmoji('💘', 0, -28, 44);
    ctx.restore();

    ctx.font = '800 44px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = '#4a2b3a';
    ctx.fillText('心动捕捉', cx, H * 0.42);
    ctx.font = '600 15px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = '#8a6474';
    ctx.fillText('接住心动，躲避心碎 · 单人恋爱小游戏', cx, H * 0.48);

    // 图例
    ctx.font = '600 16px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = '#6b4658';
    ctx.fillText('❤️ 💖 🌟 接住得分', cx, H * 0.56);
    ctx.fillText('💔 ⚡ 记得躲开', cx, H * 0.62);
    ctx.font = '600 13px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = '#8a6474';
    ctx.fillText('漏接心动会心碎 · 攒满心动值触发告白时刻', cx, H * 0.68);

    // 开始按钮
    var btnW = 200, btnH = 56, bx = cx - btnW / 2, by = H * 0.74;
    var hover = input.mode === 'mouse' && Math.abs(input.targetX - cx) < btnW / 2 && Math.abs(input.targetY - by - btnH / 2) < btnH / 2;
    roundRect(bx, by, btnW, btnH, 28);
    var bg = ctx.createLinearGradient(0, by, 0, by + btnH);
    bg.addColorStop(0, hover ? '#ff6b8d' : '#ff5c8a');
    bg.addColorStop(1, hover ? '#ff3d6d' : '#e62d55');
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.shadowColor = 'rgba(230,45,85,0.4)';
    ctx.shadowBlur = hover ? 24 : 12;
    ctx.shadowOffsetY = 6;
    roundRect(bx, by, btnW, btnH, 28);
    ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.font = '800 22px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('开始心动', cx, by + btnH / 2 + 1);

    // 操作说明
    ctx.font = '600 12px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = 'rgba(74,43,58,0.5)';
    ctx.fillText('操作：鼠标 / 触屏 移动 · 方向键 ← → · M 静音', cx, H * 0.88);
    ctx.restore();
  }

  function drawGameOver() {
    ctx.save();
    // 遮罩
    ctx.fillStyle = 'rgba(255,240,245,0.82)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var cx = W / 2;

    var ending = getEnding(score);
    ctx.font = '48px "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
    ctx.fillText(ending.icon, cx, H * 0.2);
    ctx.font = '800 30px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = '#4a2b3a';
    ctx.fillText(ending.title, cx, H * 0.3);
    ctx.font = '600 15px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = '#8a6474';
    ctx.fillText(ending.desc, cx, H * 0.36);

    // 数据卡片
    var cardW = Math.min(320, W - 40), cardH = 150, cxx = cx - cardW / 2, cyy = H * 0.42;
    roundRect(cxx, cyy, cardW, cardH, 20);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(230,69,111,0.25)';
    ctx.stroke();

    ctx.font = '700 40px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = '#e62d55';
    ctx.fillText(String(score), cx, cyy + 46);
    ctx.font = '600 13px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = '#8a6474';
    ctx.fillText('心动得分', cx, cyy + 72);

    var isNew = score > best;
    if (isNew) {
      ctx.font = '700 15px -apple-system, "PingFang SC", sans-serif';
      ctx.fillStyle = '#ffb020';
      ctx.fillText('🏆 新纪录！', cx, cyy + 96);
    } else {
      ctx.font = '600 13px -apple-system, "PingFang SC", sans-serif';
      ctx.fillStyle = 'rgba(74,43,58,0.55)';
      ctx.fillText('最高分 ' + best + ' · 最高连击 ' + bestCombo, cx, cyy + 96);
    }
    ctx.font = '600 13px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = 'rgba(74,43,58,0.55)';
    ctx.fillText('本局最高连击 ' + bestCombo + ' · 坚持到第 ' + level + ' 关', cx, cyy + 120);

    // 再来一次按钮
    var btnW = 200, btnH = 54, bx = cx - btnW / 2, by = H * 0.74;
    var hover = input.mode === 'mouse' && Math.abs(input.targetX - cx) < btnW / 2 && Math.abs(input.targetY - by - btnH / 2) < btnH / 2;
    roundRect(bx, by, btnW, btnH, 27);
    var bg = ctx.createLinearGradient(0, by, 0, by + btnH);
    bg.addColorStop(0, hover ? '#ff6b8d' : '#ff5c8a');
    bg.addColorStop(1, hover ? '#ff3d6d' : '#e62d55');
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.font = '800 20px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('再试一次', cx, by + btnH / 2 + 1);

    ctx.font = '600 12px -apple-system, "PingFang SC", sans-serif';
    ctx.fillStyle = 'rgba(74,43,58,0.5)';
    ctx.fillText('按 空格 / 回车 或点击按钮重新开始', cx, H * 0.86);
    ctx.restore();
  }

  function getEnding(s) {
    if (s >= 420) return { icon: '💍', title: '命中注定', desc: '心动满格，甜度爆表，你就是天选之人！' };
    if (s >= 260) return { icon: '💘', title: '情投意合', desc: '心有灵犀，浪漫满屋，离告白只差一步。' };
    if (s >= 130) return { icon: '💗', title: '怦然心动', desc: '暧昧升温，心跳加速，再勇敢一点。' };
    if (s >= 45)  return { icon: '💌', title: '初来心动', desc: '情窦初开，青涩美好，继续加油哦。' };
    return { icon: '💔', title: '擦肩而过', desc: '缘分未到？别灰心，心动需要练习。' };
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 背景
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#ffd6e0');
    bg.addColorStop(0.5, '#ffeef2');
    bg.addColorStop(1, '#f6ecff');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) {
      var s = shake * 9;
      ctx.translate(rand(-s, s), rand(-s, s));
    }
    drawFloaters();

    if (state === 'menu') {
      drawMenu();
    } else if (state === 'playing' || state === 'over') {
      drawItems();
      drawParticles();
      drawPlayer();
      drawPopups();
      drawHUD();
    }

    ctx.restore();

    // 结算界面绘制在震动位移之外，保证静止
    if (state === 'over') drawGameOver();

    // 告白闪屏
    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + clamp(flash, 0, 1) * 0.75 + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ================= 主循环 =================
  var last = 0;
  function loop(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
    last = ts;
    // 震动/闪屏在所有状态下统一衰减，避免死亡结算后卡住不动
    if (shake > 0) shake = Math.max(0, shake - dt * 2.6);
    if (flash > 0) flash = Math.max(0, flash - dt * 1.4);
    if (state === 'playing') update(dt);
    else time += dt;
    draw();
    requestAnimationFrame(loop);
  }

  // ================= 流程控制 =================
  function startGame() {
    initAudio();
    score = 0; lives = MAX_LIVES; level = 1; combo = 0; bestCombo = 0;
    loveMeter = 0; fever = 0; spawnTimer = 0.4; caughtCount = 0;
    items = []; particles = []; popups = []; shake = 0; flash = 0;
    player.x = W / 2;
    state = 'playing';
    sfx.click();
  }

  function endGame() {
    if (state === 'over') return;
    state = 'over';
    sfx.over();
    if (score > best) {
      best = score;
      try { localStorage.setItem('heartcatch.best', String(best)); } catch (e) {}
    }
    var e = getEnding(score);
    records.push({ time: Date.now(), score: score, combo: bestCombo, level: level, icon: e.icon, title: e.title });
    if (records.length > 50) records = records.slice(-50);
    saveRecords();
  }

  function clickAt(x, y) {
    var cx = W / 2;
    if (state === 'menu') {
      // 顶部用户栏 → 打开个人中心
      if (x > 12 && x < 330 && y > 12 && y < 74) { openPanel(); return; }
      var by = H * 0.74, btnW = 200, btnH = 56;
      if (Math.abs(x - cx) < btnW / 2 && Math.abs(y - by - btnH / 2) < btnH / 2) startGame();
      else startGame();
    } else if (state === 'over') {
      var by2 = H * 0.74, btnW2 = 200, btnH2 = 54;
      if (Math.abs(x - cx) < btnW2 / 2 && Math.abs(y - by2 - btnH2 / 2) < btnH2 / 2) startGame();
    }
  }

  // ================= 输入 =================
  canvas.addEventListener('pointermove', function (e) {
    var r = canvas.getBoundingClientRect();
    input.mode = 'mouse';
    input.targetX = e.clientX - r.left;
    input.targetY = e.clientY - r.top;
  });
  canvas.addEventListener('pointerdown', function (e) {
    initAudio();
    var r = canvas.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    input.targetX = x; input.targetY = y;
    clickAt(x, y);
  });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  window.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return; // 输入框内按键不交给游戏
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { input.keyDir = -1; input.mode = 'key'; e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { input.keyDir = 1; input.mode = 'key'; e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'Enter') {
      if (overlay.classList.contains('hidden') && (state === 'menu' || state === 'over')) startGame();
      e.preventDefault();
    }
    else if (e.key === 'm' || e.key === 'M') { muted = !muted; }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { if (input.keyDir === -1) input.keyDir = 0; }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { if (input.keyDir === 1) input.keyDir = 0; }
  });

  // ================= 启动 =================
  player.y = H - 70;
  resize();
  player.y = H - 70;
  initFloaters();
  input.targetX = W / 2;
  requestAnimationFrame(loop);

  // 首次进入自动弹出个人中心，引导完善昵称与头像
  try {
    if (!localStorage.getItem('heartcatch.onboarded')) {
      localStorage.setItem('heartcatch.onboarded', '1');
      setTimeout(openPanel, 350);
    }
  } catch (e) {}
})();
</script>
</body>
</html>
