<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f3ee">
    <title>一页 · 我的空间</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
    <header class="topbar">
        <div class="brand-mark"><span>一页</span></div>
        <div class="user">
            <span class="user-avatar" id="userAvatar">一</span>
            <span class="user-name" id="userName">朋友</span>
            <button class="logout" id="logoutBtn" type="button">退出</button>
        </div>
    </header>

    <main class="home">
        <p class="today" id="today"></p>
        <h1 class="greeting" id="greeting"></h1>
        <p class="home-sub">今天想留下点什么？</p>

        <div class="entries">
            <a class="entry" href="javascript:void(0)" data-feature="日记">
                <span class="entry-index">01</span>
                <h2>日记</h2>
                <p>记录一天里值得记住的片段。</p>
                <span class="entry-arrow">→</span>
            </a>
            <a class="entry" href="javascript:void(0)" data-feature="账本">
                <span class="entry-index">02</span>
                <h2>账本</h2>
                <p>收入与支出，心里有数。</p>
                <span class="entry-arrow">→</span>
            </a>
            <a class="entry" href="javascript:void(0)" data-feature="随笔">
                <span class="entry-index">03</span>
                <h2>随笔</h2>
                <p>没有主题的念头，也值得留下。</p>
                <span class="entry-arrow">→</span>
            </a>
        </div>

        <p class="home-foot">一页 · 安静的记录</p>
    </main>

    <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
