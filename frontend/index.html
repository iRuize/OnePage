<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f3ee">
    <title>一页 · 登录</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <main class="shell">
        <!-- ================= 左侧品牌区 ================= -->
        <section class="brand">
            <div class="brand-mark"><span>一页</span></div>

            <h1>把日子，<br>写成一页。</h1>

            <p class="brand-sub">日记、账本与随笔，安静地留在这里。</p>

            <div class="brand-meta">
                <span>日记</span><i></i><span>账本</span><i></i><span>随笔</span>
            </div>

            <div class="brand-foot">留给以后的自己</div>
        </section>

        <!-- ================= 右侧表单区 ================= -->
        <section class="auth-card" id="authCard">
            <!-- 登录 / 注册 -->
            <div id="authView" class="view">
                <header class="card-head">
                    <h2 class="card-title" id="cardTitle">欢迎回来</h2>
                    <p class="card-sub" id="cardSub">登录后继续你的记录</p>
                </header>

                <div class="segmented" id="segmented" data-active="login">
                    <button type="button" class="seg-btn active" data-tab="login">登录</button>
                    <button type="button" class="seg-btn" data-tab="register">注册</button>
                </div>

                <!-- 登录表单 -->
                <form id="loginForm" class="form" novalidate>
                    <div class="field" id="loginUserField">
                        <label for="loginUser">用户名</label>
                        <input id="loginUser" name="username" type="text"
                               autocomplete="username" maxlength="20">
                    </div>

                    <div class="field" id="loginPassField">
                        <label for="loginPass">密码</label>
                        <div class="field-row">
                            <input id="loginPass" name="password" type="password"
                                   autocomplete="current-password" maxlength="32">
                            <button type="button" class="eye" data-target="loginPass"
                                    aria-label="显示或隐藏密码">显示</button>
                        </div>
                    </div>

                    <div class="row-between">
                        <label class="check">
                            <input type="checkbox" id="remember" checked>
                            <span class="box"></span>记住我
                        </label>
                        <span class="link-muted">安全登录</span>
                    </div>

                    <button type="submit" class="btn-primary" id="loginBtn">
                        <span class="btn-text">登 录</span>
                        <span class="spinner"></span>
                    </button>

                    <p class="form-tip">
                        还没有账号？
                        <button type="button" class="link" data-goto="register">注册一个</button>
                    </p>
                </form>

                <!-- 注册表单 -->
                <form id="registerForm" class="form" hidden novalidate>
                    <div class="field" id="regUserField">
                        <label for="regUser">用户名（3-20 位字母、数字或下划线）</label>
                        <input id="regUser" name="username" type="text"
                               autocomplete="username" maxlength="20">
                    </div>

                    <div class="field" id="regNickField">
                        <label for="regNick">昵称（选填）</label>
                        <input id="regNick" name="nickname" type="text"
                               autocomplete="nickname" maxlength="16">
                    </div>

                    <div class="field" id="regPassField">
                        <label for="regPass">密码（6-32 位）</label>
                        <div class="field-row">
                            <input id="regPass" name="password" type="password"
                                   autocomplete="new-password" maxlength="32">
                            <button type="button" class="eye" data-target="regPass"
                                    aria-label="显示或隐藏密码">显示</button>
                        </div>
                    </div>

                    <div class="field" id="regPass2Field">
                        <label for="regPass2">确认密码</label>
                        <div class="field-row">
                            <input id="regPass2" name="confirm" type="password"
                                   autocomplete="new-password" maxlength="32">
                            <button type="button" class="eye" data-target="regPass2"
                                    aria-label="显示或隐藏密码">显示</button>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" id="registerBtn">
                        <span class="btn-text">创建账号</span>
                        <span class="spinner"></span>
                    </button>

                    <p class="form-tip">
                        已有账号？
                        <button type="button" class="link" data-goto="login">直接登录</button>
                    </p>
                </form>
            </div>

            <!-- 已登录 -->
            <div id="welcomeView" class="welcome" hidden>
                <div class="welcome-avatar" id="welcomeAvatar">一</div>
                <h2>欢迎回来，<span id="welcomeName">朋友</span></h2>
                <p>你的记录还在继续</p>
                <button type="button" class="btn-primary" id="continueBtn">
                    <span class="btn-text">进入我的空间</span>
                    <span class="spinner"></span>
                </button>
                <button type="button" class="btn-ghost" id="logoutBtn">退出登录</button>
            </div>
        </section>
    </main>

    <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

    <div class="success-overlay" id="successOverlay" aria-hidden="true">
        <div class="success-mark">一页</div>
        <div class="success-title">欢迎回来</div>
        <div class="success-sub">正在进入你的空间…</div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
