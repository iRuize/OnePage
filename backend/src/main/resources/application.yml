server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: love-backend
  datasource:
    # 达梦数据库（DM8），默认模式 SOFTDEMO
    driver-class-name: dm.jdbc.driver.DmDriver
    url: "${DM_URL:jdbc:dm://localhost:5236?schema=SOFTDEMO}"
    username: ${DM_USERNAME:SYSDBA}
    password: ${DM_PASSWORD:Duohereshui1}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # 达梦连接有效性检测
      connection-test-query: SELECT 1 FROM DUAL
  sql:
    init:
      # 每次启动执行建表脚本，脚本内使用 IF NOT EXISTS 保证幂等
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 单张图片上限
      max-file-size: 10MB
      # 单次请求上限（多图上传）
      max-request-size: 20MB

# MyBatis-Plus 数据访问层配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

love:
  auth:
    # 生产环境请替换为环境变量注入的随机密钥
    secret: ${LOVE_AUTH_SECRET:love-heart-catch-demo-secret-change-me-in-production}
    token-ttl-hours: 168
  storage:
    # 日记图片上传目录（相对后端工作目录）
    upload-dir: ./data/uploads

logging:
  level:
    com.love: info
    # 打印 Mapper 执行的 SQL 与参数
    com.love.mapper: debug
